services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - ADMIN_PASSWORD=1120835055
    volumes:
      - ./content:/app/content

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel run
    volumes:
      - ./cloudflared:/etc/cloudflared
